apiVersion: v1
kind: Namespace
metadata:
  name: fdroid
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fdroid-data
  namespace: fdroid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdroid
  namespace: fdroid
  labels:
    app: fdroid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fdroid
  template:
    metadata:
      labels:
        app: fdroid
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fdroid-data
---
apiVersion: v1
kind: Service
metadata:
  name: fdroid
  namespace: fdroid
spec:
  selector:
    app: fdroid
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fdroid
  namespace: fdroid
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fdroid.ha1nz.de
      secretName: fdroid-ha1nz-de-tls
  rules:
    - host: fdroid.ha1nz.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fdroid
                port:
                  number: 80

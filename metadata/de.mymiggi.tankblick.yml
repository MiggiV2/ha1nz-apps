Summary: German fuel prices for E5, E10 and diesel — no account, no tracking
Description: |-
  Current prices for E5, E10 and diesel at German filling stations — fetched
  quickly, with nobody looking over your shoulder.

  Features:

  * Nearby search — price, distance and open/closed status, sorted by price or distance, filtered per fuel type without a new request
  * Favourites — the stations you actually visit, all refreshed in a single request
  * Detail view — all three prices, address, opening hours
  * Navigation with the app of your choice: Organic Maps, OsmAnd, or whatever else is installed
  * Offline-first — a Room cache keeps working without a connection, and every screen says honestly how old the prices on it are
  * Self-imposed rate limiting — 60 s between refreshes, radius capped at 25 km, as required by the Tankerkönig terms of use
  * Privacy first — no account, no trackers, no ads, no analytics, no background requests

  The app talks to exactly one server: creativecommons.tankerkoenig.de. Your
  location leaves the device only as a coordinate pair in a search you started
  yourself. Favourites, settings and prices stay local, and price history is
  deleted after 30 days.

  You need your own API key. Tankerkönig issues keys per person, and a key
  hidden inside the app could be extracted anyway. Register for free at
  onboarding.tankerkoenig.de — first name, last name and email address are
  required, and keys are reviewed by hand, which can take a few days. A demo
  key is available in the app for trying it out. Your key is encrypted with
  AES-256-GCM in the Android Keystore and excluded from cloud backup.

  Price data: Tankerkönig / Markttransparenzstelle für Kraftstoffe of the
  Bundeskartellamt, licensed under CC BY 4.0 —
  https://creativecommons.tankerkoenig.de/

  This app is developed with AI (Claude / Claude Code) and manually tested and
  maintained by a human.
